name: ruff-action
  # You may pin to the exact commit or the version.
  # uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
  uses: astral-sh/ruff-action@v4.1.0
  with:
    # Arguments passed to Ruff. Use `ruff --help` to see available options. Defaults to `check`.
    args: # optional, default is check
    # Source path(s) or @actions/glob pattern(s) to run Ruff on. Defaults to the current workspace.
    src: # optional, default is ${{ github.workspace }}
    # The version of Ruff to use, e.g., `0.6.0`. Defaults to the first discoverable version in pyproject.toml searched upward from `src`, or `latest`.
    version: # optional, default is 
    # Path to a pyproject.toml, requirements.txt or uv.lock file to read the version from. If parsing fails, the action warns and falls back to `latest`.
    version-file: # optional
    # The checksum of the ruff version to install
    checksum: # optional
    # URL to a custom manifest file in the astral-sh/versions format.
    manifest-file: # optional
    # Download Ruff from the Astral mirror instead of directly from GitHub Releases.
    download-from-astral-mirror: # optional, default is true
    # Used for authenticated downloads of Ruff release artifacts from GitHub.
    github-token: # optional, default is ${{ github.token }}
